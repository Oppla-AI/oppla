name: Bug Report (Debugger)
description: Oppla Debugger-Related Bugs
type: "Bug"
labels: ["debugger"]
title: "Debugger: <a short description of the Debugger bug>"
body:
  - type: textarea
    attributes:
      label: Summary
      description: Describe the bug with a one line summary, and provide detailed reproduction steps
      value: |
        <!-- Please insert a one line summary of the issue below -->
        SUMMARY_SENTENCE_HERE

        ### Description
        <!--  Describe with sufficient detail to reproduce from a clean Oppla install. -->
        Steps to trigger the problem:
        1.
        2.
        3.

        **Expected Behavior**:
        **Actual Behavior**:

    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Oppla Version and System Specs
      description: 'Open Oppla, and in the command palette select "oppla: copy system specs into clipboard"'
      placeholder: |
        Output of "oppla: copy system specs into clipboard"
    validations:
      required: true
